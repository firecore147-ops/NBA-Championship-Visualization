
name: Render Quarto NBA Project

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

     
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib ipython jinja2 \
            nbformat nbclient ipykernel pyyaml


      - name: Render with Quarto
        run: |
          quarto --version
          quarto render Charlie_Buckman_NBA_Visualizations.qmd --to html

      - name: Verify rendered output
        run: |
          test -s Charlie_Buckman_NBA_Visualizations.html
          test -s annotated_championships.png
          test -s direct_labeled_championships.png
          echo "Quarto render verified."

      - name: Package final submission
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          files = [
              "Charlie_Buckman_NBA_Visualizations.ipynb",
              "Charlie_Buckman_NBA_Visualizations.qmd",
              "Charlie_Buckman_NBA_Visualizations.html",
              "annotated_championships.png",
              "direct_labeled_championships.png",
              "README.md",
          ]
          output = "Charlie_Buckman_NBA_Submission.zip"
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for name in files:
                  if not Path(name).is_file():
                      raise FileNotFoundError(name)
                  archive.write(name)
          print("Created:", output)
          PY

      - name: Upload finished ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Charlie_Buckman_NBA_Submission
          path: Charlie_Buckman_NBA_Submission.zip
